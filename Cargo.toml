[package]
name = "ikvmt"
version = "0.2.0"
edition = "2024"
description = "Native Supermicro iKVM console tools for humans and AI agents"
license = "Apache-2.0"
rust-version = "1.94"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
native-tls = "0.2"
ocrs = { version = "0.13.1", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.28", features = ["native-tls"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
